# 洗衣机控制脚本示例（追加到 ~/.homeassistant/scripts.yaml）
# 配置里已有 script: !include scripts.yaml

haier_wash_program:
  alias: 海尔洗衣机-选择程序
  fields:
    program:
      description: 程序名（与 select 选项一致，如 棉麻/化纤/羽绒/混合/衬衣/童装/轻柔/羊毛/牛仔）
      example: 棉麻
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_YOUR_HAIER_DEVICE_ID_unifiedprogramsettings
      data:
        option: "{{ program }}"
haier_wash_start:
  alias: 海尔洗衣机-启动
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_YOUR_HAIER_DEVICE_ID_runningmode
      data:
        option: 启动
haier_wash_pause:
  alias: 海尔洗衣机-暂停
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_YOUR_HAIER_DEVICE_ID_runningmode
      data:
        option: 暂停
haier_wash_temp:
  alias: 海尔洗衣机-设置水温
  fields:
    temperature:
      description: 水温（℃）
      example: 40
  sequence:
    - service: number.set_value
      target:
        entity_id: number.haier_YOUR_HAIER_DEVICE_ID_washtemp
      data:
        value: "{{ temperature }}"
haier_wash_spin:
  alias: 海尔洗衣机-设置脱水转速
  fields:
    speed:
      description: 转速
      example: 1200
  sequence:
    - service: number.set_value
      target:
        entity_id: number.haier_YOUR_HAIER_DEVICE_ID_spinspeed
      data:
        value: "{{ speed }}"

d9_washer_program:
  alias: 小洗衣机-左筒(洗)选程序
  fields:
    program:
      description: 程序名（English，见 select 选项，如 underwear/baby_clothes/cotton）
      example: underwear
  sequence:
    - service: select.select_option
      target:
        entity_id: select.YOUR_WASHER_DEVICE_ID_db_program
      data:
        option: "{{ program }}"
d9_washer_start:
  alias: 小洗衣机-左筒(洗)启动
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_WASHER_DEVICE_ID_db_start
d9_washer_pause:
  alias: 小洗衣机-左筒(洗)暂停
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_WASHER_DEVICE_ID_db_pause
d9_dryer_program:
  alias: 小洗衣机-右筒(烘)选程序
  fields:
    program:
      description: 程序名（English，见 select 选项，如 intelligent_dry/quick_dry/low_temp_dry）
      example: intelligent_dry
  sequence:
    - service: select.select_option
      target:
        entity_id: select.YOUR_WASHER_DEVICE_ID_dc_program
      data:
        option: "{{ program }}"
d9_dryer_start:
  alias: 小洗衣机-右筒(烘)启动
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_WASHER_DEVICE_ID_dc_start
d9_dryer_pause:
  alias: 小洗衣机-右筒(烘)暂停
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_WASHER_DEVICE_ID_dc_pause


dishwasher_program:
  alias: 洗碗机-选择模式（不启动）
  fields:
    program:
      description: auto_wash/eco_wash/strong_wash/single_dry/wash_dry
      example: auto_wash
  sequence:
    - service: select.select_option
      target:
        entity_id: select.YOUR_DISHWASHER_DEVICE_ID_program
      data:
        option: "{{ program }}"
dishwasher_mode_start:
  alias: 洗碗机-按模式启动（智能/节能/超强）
  fields:
    mode:
      description: auto_wash(智能)/eco_wash(节能)/strong_wash(超强)
      example: auto_wash
  sequence:
    - service: select.select_option
      target:
        entity_id: select.YOUR_DISHWASHER_DEVICE_ID_mode_select
      data:
        option: "{{ mode }}"
dishwasher_start:
  alias: 洗碗机-启动
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_DISHWASHER_DEVICE_ID_start
dishwasher_pause:
  alias: 洗碗机-暂停
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_DISHWASHER_DEVICE_ID_pause
dishwasher_resume:
  alias: 洗碗机-继续
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_DISHWASHER_DEVICE_ID_resume
dishwasher_cancel:
  alias: 洗碗机-取消
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_DISHWASHER_DEVICE_ID_cancel
dishwasher_delay:
  alias: 洗碗机-设置预约时间
  fields:
    minutes:
      description: 预约分钟数（0=取消）
      example: 60
  sequence:
    - service: number.set_value
      target:
        entity_id: number.YOUR_DISHWASHER_DEVICE_ID_delay_minutes
      data:
        value: "{{ minutes }}"
dishwasher_start_delayed:
  alias: 洗碗机-预约启动
  sequence:
    - service: button.press
      target:
        entity_id: button.YOUR_DISHWASHER_DEVICE_ID_start_delayed


haier_smart_wash:
  alias: 海尔-一键智慧洗
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.YOUR_HAIER_DEVICE_ID_onoffstatus
    - delay: "00:00:02"
    - service: select.select_option
      target:
        entity_id: select.YOUR_HAIER_DEVICE_ID_unifiedprogramsettings
      data:
        option: "智慧洗"
    - wait_template: "{{ is_state('select.YOUR_HAIER_DEVICE_ID_unifiedprogramsettings', '智慧洗') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
    - delay: "00:00:02"
    - service: select.select_option
      target:
        entity_id: select.YOUR_HAIER_DEVICE_ID_runningmode
      data:
        option: "启动"
dishwasher_standard:
  alias: 洗碗机-选择Standard（不启动）
  sequence:
    - service: select.select_option
      target:
        entity_id: select.YOUR_DISHWASHER_DEVICE_ID_program
      data:
        option: standard_wash
dishwasher_standard_start:
  alias: 洗碗机-一键Standard启动
  sequence:
    - service: select.select_option
      target:
        entity_id: select.YOUR_DISHWASHER_DEVICE_ID_mode_select
      data:
        option: standard_wash

# 美的云程序 ID（实测）：156=程序A、148=程序B；设置程序后设备会自动切到对应筒。
d9_wash_program_a:
  alias: 小洗衣机-程序A洗（左筒+烘干+启动）
  # 关键：筒位+程序/烘干/启动 必须放在同一条 TLV 记录里
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.YOUR_WASHER_DEVICE_ID_db_power
    - delay: "00:00:02"
    - service: midea_ac_lan.send_command
      data:
        device_id: YOUR_WASHER_DEVICE_ID
        cmd_type: 2
        cmd_body: "db32010104019c"
    - delay: "00:00:02"
    - service: midea_ac_lan.send_command
      data:
        device_id: YOUR_WASHER_DEVICE_ID
        cmd_type: 2
        cmd_body: "db320101060101"
    - delay: "00:00:02"
    - service: midea_ac_lan.send_command
      data:
        device_id: YOUR_WASHER_DEVICE_ID
        cmd_type: 2
        cmd_body: "db320101020101"
d9_wash_program_b:
  alias: 小洗衣机-程序B洗（右筒+烘干+启动）
  # 同上：筒位必须与程序/启动组合发送
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.YOUR_WASHER_DEVICE_ID_db_power
    - delay: "00:00:02"
    - service: midea_ac_lan.send_command
      data:
        device_id: YOUR_WASHER_DEVICE_ID
        cmd_type: 2
        cmd_body: "db320102040194"
    - delay: "00:00:02"
    - service: midea_ac_lan.send_command
      data:
        device_id: YOUR_WASHER_DEVICE_ID
        cmd_type: 2
        cmd_body: "db320102060101"
    - delay: "00:00:02"
    - service: midea_ac_lan.send_command
      data:
        device_id: YOUR_WASHER_DEVICE_ID
        cmd_type: 2
        cmd_body: "db320102020101"
haier_smart_program_only:
  alias: 海尔-只选智慧洗（不启动）
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.YOUR_HAIER_DEVICE_ID_onoffstatus
    - delay: "00:00:02"
    - service: select.select_option
      target:
        entity_id: select.YOUR_HAIER_DEVICE_ID_unifiedprogramsettings
      data:
        option: "智慧洗"
    - wait_template: "{{ is_state('select.YOUR_HAIER_DEVICE_ID_unifiedprogramsettings', '智慧洗') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
