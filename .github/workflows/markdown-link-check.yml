name: Markdown links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check relative links and images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local markdown links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: only validate links/images that point to files in the repo.
          # External sites are intentionally skipped so the job does not fail when a
          # third-party page is temporarily down (or blocked in some regions).
          args: >-
            --offline --no-progress --verbose --accept 200..=299
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
