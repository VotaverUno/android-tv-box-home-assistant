# 洗衣机控制脚本示例（追加到 ~/.homeassistant/scripts.yaml）
# 配置里已有 script: !include scripts.yaml

haier_wash_program:
  alias: 海尔洗衣机-选择程序
  fields:
    program:
      description: 程序名（与 select 选项一致，如 棉麻/化纤/羽绒/混合/衬衣/童装/轻柔/羊毛/牛仔）
      example: 棉麻
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_3c164064010e_unifiedprogramsettings
      data:
        option: "{{ program }}"
haier_wash_start:
  alias: 海尔洗衣机-启动
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_3c164064010e_runningmode
      data:
        option: 启动
haier_wash_pause:
  alias: 海尔洗衣机-暂停
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_3c164064010e_runningmode
      data:
        option: 暂停
haier_wash_temp:
  alias: 海尔洗衣机-设置水温
  fields:
    temperature:
      description: 水温（℃）
      example: 40
  sequence:
    - service: number.set_value
      target:
        entity_id: number.haier_3c164064010e_washtemp
      data:
        value: "{{ temperature }}"
haier_wash_spin:
  alias: 海尔洗衣机-设置脱水转速
  fields:
    speed:
      description: 转速
      example: 1200
  sequence:
    - service: number.set_value
      target:
        entity_id: number.haier_3c164064010e_spinspeed
      data:
        value: "{{ speed }}"

d9_washer_program:
  alias: 小洗衣机-左筒(洗)选程序
  fields:
    program:
      description: 程序名（English，见 select 选项，如 underwear/baby_clothes/cotton）
      example: underwear
  sequence:
    - service: select.select_option
      target:
        entity_id: select.212305754200590_db_program
      data:
        option: "{{ program }}"
d9_washer_start:
  alias: 小洗衣机-左筒(洗)启动
  sequence:
    - service: button.press
      target:
        entity_id: button.212305754200590_db_start
d9_washer_pause:
  alias: 小洗衣机-左筒(洗)暂停
  sequence:
    - service: button.press
      target:
        entity_id: button.212305754200590_db_pause
d9_dryer_program:
  alias: 小洗衣机-右筒(烘)选程序
  fields:
    program:
      description: 程序名（English，见 select 选项，如 intelligent_dry/quick_dry/low_temp_dry）
      example: intelligent_dry
  sequence:
    - service: select.select_option
      target:
        entity_id: select.212305754200590_dc_program
      data:
        option: "{{ program }}"
d9_dryer_start:
  alias: 小洗衣机-右筒(烘)启动
  sequence:
    - service: button.press
      target:
        entity_id: button.212305754200590_dc_start
d9_dryer_pause:
  alias: 小洗衣机-右筒(烘)暂停
  sequence:
    - service: button.press
      target:
        entity_id: button.212305754200590_dc_pause


dishwasher_program:
  alias: 洗碗机-选择模式（不启动）
  fields:
    program:
      description: auto_wash/eco_wash/strong_wash/single_dry/wash_dry
      example: auto_wash
  sequence:
    - service: select.select_option
      target:
        entity_id: select.212305747490962_program
      data:
        option: "{{ program }}"
dishwasher_mode_start:
  alias: 洗碗机-按模式启动（智能/节能/超强）
  fields:
    mode:
      description: auto_wash(智能)/eco_wash(节能)/strong_wash(超强)
      example: auto_wash
  sequence:
    - service: select.select_option
      target:
        entity_id: select.212305747490962_mode_select
      data:
        option: "{{ mode }}"
dishwasher_start:
  alias: 洗碗机-启动
  sequence:
    - service: button.press
      target:
        entity_id: button.212305747490962_start
dishwasher_pause:
  alias: 洗碗机-暂停
  sequence:
    - service: button.press
      target:
        entity_id: button.212305747490962_pause
dishwasher_resume:
  alias: 洗碗机-继续
  sequence:
    - service: button.press
      target:
        entity_id: button.212305747490962_resume
dishwasher_cancel:
  alias: 洗碗机-取消
  sequence:
    - service: button.press
      target:
        entity_id: button.212305747490962_cancel
dishwasher_delay:
  alias: 洗碗机-设置预约时间
  fields:
    minutes:
      description: 预约分钟数（0=取消）
      example: 60
  sequence:
    - service: number.set_value
      target:
        entity_id: number.212305747490962_delay_minutes
      data:
        value: "{{ minutes }}"
dishwasher_start_delayed:
  alias: 洗碗机-预约启动
  sequence:
    - service: button.press
      target:
        entity_id: button.212305747490962_start_delayed


haier_smart_wash:
  alias: 海尔洗衣机-一键智慧洗
  sequence:
    - service: select.select_option
      target:
        entity_id: select.haier_3c164064010e_unifiedprogramsettings
      data:
        option: "智慧洗"
    - service: select.select_option
      target:
        entity_id: select.haier_3c164064010e_runningmode
      data:
        option: "启动"
dishwasher_standard:
  alias: 洗碗机-选择Standard（不启动）
  sequence:
    - service: select.select_option
      target:
        entity_id: select.212305747490962_program
      data:
        option: standard_wash
dishwasher_standard_start:
  alias: 洗碗机-一键Standard启动
  sequence:
    - service: select.select_option
      target:
        entity_id: select.212305747490962_mode_select
      data:
        option: standard_wash

# 美的云程序 ID（实测）：156=内裤、148=袜子；设置程序后设备会自动切到对应筒。
d9_wash_underwear:
  alias: 小洗衣机-内裤洗（156）
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.YOUR_DEVICE_ID_db_power
    - delay: "00:00:02"
    - service: midea_ac_lan.set_attribute
      data:
        device_id: YOUR_MIDEA_DEVICE_ID
        attribute: db_program
        value: 156
    - service: button.press
      target:
        entity_id: button.YOUR_DEVICE_ID_db_start
d9_wash_socks:
  alias: 小洗衣机-袜子洗（148）
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.YOUR_DEVICE_ID_db_power
    - delay: "00:00:02"
    - service: midea_ac_lan.set_attribute
      data:
        device_id: YOUR_MIDEA_DEVICE_ID
        attribute: db_program
        value: 148
    - service: button.press
      target:
        entity_id: button.YOUR_DEVICE_ID_db_start
